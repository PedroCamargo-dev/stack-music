name: stack_music
description: Stack Music — player Navidrome (Subsonic) + busca/download via API própria.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  just_audio: ^0.9.40
  audio_service: ^0.18.17
  audio_session: ^0.1.21
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  crypto: ^3.0.6
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true